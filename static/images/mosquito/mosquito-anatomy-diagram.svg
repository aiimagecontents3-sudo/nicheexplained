<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Helvetica, Arial, sans-serif">
<title>Labelled mosquito anatomy diagram: head, thorax and abdomen</title>
<rect width="1200" height="630" rx="18" fill="#ffffff"/>
<text x="600" y="48" text-anchor="middle" font-size="32" font-weight="700" fill="#1f2937">Mosquito Anatomy (female)</text>
<text x="600" y="78" text-anchor="middle" font-size="17" fill="#6b7280">Simplified side view · not to scale · NicheExplained</text>
<g stroke="#374151" stroke-width="3" fill="none" stroke-linecap="round">
 <!-- legs -->
 <path d="M520 360 L470 450 L400 560"/><path d="M545 365 L560 470 L520 590"/><path d="M570 360 L650 450 L700 580"/>
 <path d="M520 360 L440 300 L330 330"/>
</g>
<!-- wing -->
<path d="M560 290 C640 170 820 150 900 190 C840 230 700 280 590 300 Z" fill="#dbeafe" fill-opacity="0.8" stroke="#3b82f6" stroke-width="2.5"/>
<path d="M590 295 L880 195 M620 290 L800 200" stroke="#93c5fd" stroke-width="1.5"/>
<!-- abdomen -->
<ellipse cx="760" cy="340" rx="190" ry="42" fill="#fde68a" stroke="#92400e" stroke-width="3" transform="rotate(8 760 340)"/>
<g stroke="#92400e" stroke-width="2"><line x1="640" y1="305" x2="636" y2="360"/><line x1="700" y1="308" x2="694" y2="372"/><line x1="760" y1="314" x2="752" y2="380"/><line x1="820" y1="322" x2="812" y2="386"/><line x1="880" y1="332" x2="872" y2="388"/></g>
<!-- thorax -->
<ellipse cx="545" cy="320" rx="62" ry="52" fill="#fcd34d" stroke="#92400e" stroke-width="3"/>
<!-- haltere -->
<line x1="598" y1="305" x2="625" y2="270" stroke="#7c3aed" stroke-width="3"/><circle cx="628" cy="265" r="8" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
<!-- head -->
<circle cx="455" cy="320" r="30" fill="#fbbf24" stroke="#92400e" stroke-width="3"/>
<ellipse cx="447" cy="314" rx="18" ry="20" fill="#7f1d1d"/>
<!-- proboscis -->
<line x1="430" y1="335" x2="250" y2="405" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
<!-- palps -->
<line x1="432" y1="330" x2="395" y2="345" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
<!-- antenna -->
<path d="M440 298 L330 220" stroke="#111827" stroke-width="3"/>
<g stroke="#111827" stroke-width="1.5"><line x1="420" y1="284" x2="410" y2="272"/><line x1="400" y1="270" x2="390" y2="258"/><line x1="380" y1="256" x2="370" y2="244"/><line x1="360" y1="242" x2="350" y2="230"/></g>
<!-- labels -->
<g font-size="19" fill="#111827">
<g stroke="#9ca3af" stroke-width="1.5">
<line x1="330" y1="220" x2="250" y2="172"/><line x1="447" y1="300" x2="420" y2="150"/><line x1="395" y1="345" x2="230" y2="300"/>
<line x1="300" y1="385" x2="210" y2="470"/><line x1="560" y1="275" x2="575" y2="150"/><line x1="760" y1="200" x2="790" y2="120"/>
<line x1="628" y1="258" x2="680" y2="120"/><line x1="900" y1="345" x2="1000" y2="300"/><line x1="700" y1="580" x2="800" y2="560"/>
<line x1="545" y1="372" x2="600" y2="520"/></g>
<text x="150" y="140">Antenna (odour, heat,</text><text x="150" y="162" font-size="16" fill="#4b5563">humidity, sound sensors)</text>
<text x="380" y="140">Compound eye</text>
<text x="40" y="290">Maxillary palp</text><text x="40" y="312" font-size="16" fill="#4b5563">(CO₂ detector)</text>
<text x="80" y="490">Proboscis</text><text x="80" y="512" font-size="16" fill="#4b5563">(labium sheath + 6 stylets)</text>
<text x="545" y="140">Thorax</text>
<text x="760" y="110">Wing (≈400–900 beats/s)</text>
<text x="620" y="110" font-size="16" fill="#6d28d9">Haltere</text>
<text x="1000" y="290">Abdomen</text><text x="1000" y="312" font-size="16" fill="#4b5563">gut, Malpighian</text><text x="1000" y="330" font-size="16" fill="#4b5563">tubules, ovaries</text>
<text x="805" y="565">6 legs</text>
<text x="560" y="540" font-size="16" fill="#4b5563">flight muscles inside thorax</text>
</g>
<g font-size="20" font-weight="700" fill="#ffffff">
<rect x="415" y="585" width="90" height="30" rx="6" fill="#d97706"/><text x="460" y="607" text-anchor="middle">HEAD</text>
<rect x="515" y="585" width="110" height="30" rx="6" fill="#b45309"/><text x="570" y="607" text-anchor="middle">THORAX</text>
<rect x="635" y="585" width="130" height="30" rx="6" fill="#92400e"/><text x="700" y="607" text-anchor="middle">ABDOMEN</text>
</g>
</svg>
