<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Arial,Helvetica,sans-serif">
<rect width="1000" height="400" fill="#fff"/>
<text x="500" y="40" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a2b4a">The journey from power plant to your plug</text>
<path d="M110 200 H890" stroke="#999" stroke-width="5"/>
<g font-size="16" text-anchor="middle">
<g transform="translate(110,0)"><rect x="-75" y="140" width="150" height="120" rx="12" fill="#fff4e0" stroke="#e39b2d" stroke-width="2"/><text y="185" font-weight="bold">Power plant</text><text y="215">Makes</text><text y="237">electricity</text></g>
<g transform="translate(305,0)"><rect x="-80" y="140" width="160" height="120" rx="12" fill="#e8f3ff" stroke="#3f7fc4" stroke-width="2"/><text y="175" font-weight="bold">Step-up</text><text y="197" font-weight="bold">transformer</text><text y="225">Pushes voltage</text><text y="245">way UP</text></g>
<g transform="translate(500,0)"><rect x="-80" y="140" width="160" height="120" rx="12" fill="#eaf7ea" stroke="#3b9a4b" stroke-width="2"/><text y="175" font-weight="bold">Big towers</text><text y="203">Carry power</text><text y="225">hundreds of km</text><text y="247">with less loss</text></g>
<g transform="translate(695,0)"><rect x="-80" y="140" width="160" height="120" rx="12" fill="#f3ecff" stroke="#7a4fc4" stroke-width="2"/><text y="175" font-weight="bold">Substation</text><text y="203">Brings voltage</text><text y="225">DOWN for</text><text y="247">your area</text></g>
<g transform="translate(890,0)"><rect x="-75" y="140" width="150" height="120" rx="12" fill="#ffecec" stroke="#c44" stroke-width="2"/><text y="175" font-weight="bold">Your meter</text><text y="203">Counts units</text><text y="225">(kWh) you</text><text y="247">use</text></g>
<text x="500" y="320" font-size="17" fill="#333">A little energy is lost as heat along the way, mostly in the local wires.</text>
<text x="500" y="350" font-size="17" fill="#333">Pole transformers near your street step it down once more before it reaches homes.</text>
</g></svg>
