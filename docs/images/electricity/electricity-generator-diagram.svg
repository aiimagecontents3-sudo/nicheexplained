<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Arial,Helvetica,sans-serif">
<rect width="960" height="420" fill="#fff"/>
<text x="480" y="40" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a2b4a">How a power plant makes electricity</text>
<g font-size="17" text-anchor="middle">
<rect x="20" y="90" width="190" height="230" rx="14" fill="#fff4e0" stroke="#e39b2d" stroke-width="2"/>
<text x="115" y="125" font-weight="bold">1. Something pushes</text>
<text x="115" y="170">Steam (from coal,</text><text x="115" y="192">gas or nuclear heat)</text>
<text x="115" y="235">Falling water</text><text x="115" y="278">Wind</text>
<rect x="260" y="90" width="190" height="230" rx="14" fill="#e8f3ff" stroke="#3f7fc4" stroke-width="2"/>
<text x="355" y="125" font-weight="bold">2. Turbine spins</text>
<g transform="translate(355,215)" fill="#3f7fc4"><circle r="12"/><path d="M0-12 L18-62 L-10-58Z"/><path d="M0-12 L18-62 L-10-58Z" transform="rotate(90)"/><path d="M0-12 L18-62 L-10-58Z" transform="rotate(180)"/><path d="M0-12 L18-62 L-10-58Z" transform="rotate(270)"/></g>
<text x="355" y="305">Like a pinwheel</text>
<rect x="500" y="90" width="210" height="230" rx="14" fill="#eaf7ea" stroke="#3b9a4b" stroke-width="2"/>
<text x="605" y="125" font-weight="bold">3. Magnet turns</text><text x="605" y="147" font-weight="bold">inside wire coils</text>
<circle cx="605" cy="220" r="52" fill="none" stroke="#b5651d" stroke-width="10" stroke-dasharray="6 4"/>
<rect x="580" y="198" width="25" height="44" fill="#d33"/><rect x="605" y="198" width="25" height="44" fill="#36c"/>
<text x="592" y="226" fill="#fff" font-size="15">N</text><text x="617" y="226" fill="#fff" font-size="15">S</text>
<text x="605" y="305">Copper coil = brown</text>
<rect x="760" y="90" width="180" height="230" rx="14" fill="#f3ecff" stroke="#7a4fc4" stroke-width="2"/>
<text x="850" y="125" font-weight="bold">4. Electricity</text><text x="850" y="147" font-weight="bold">flows out</text>
<path d="M790 220 H910" stroke="#7a4fc4" stroke-width="6"/><path d="M860 190 l-14 30 h16 l-14 30" stroke="#f2b600" stroke-width="5" fill="none"/>
<text x="850" y="290">Into the wires</text>
</g>
<g fill="#555"><path d="M215 205 h35 m-10-9 l10 9 -10 9" stroke="#555" stroke-width="4" fill="none"/><path d="M455 205 h35 m-10-9 l10 9 -10 9" stroke="#555" stroke-width="4" fill="none"/><path d="M715 205 h35 m-10-9 l10 9 -10 9" stroke="#555" stroke-width="4" fill="none"/></g>
<text x="480" y="375" font-size="17" text-anchor="middle" fill="#333">Solar panels are the odd one out: sunlight makes electricity directly, with nothing spinning.</text>
</svg>
